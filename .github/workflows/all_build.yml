name: Build All

on: [push]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write

jobs:
  build_windows_x64:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        id: win-deps-x64
        with:
          path: vcpkg
          key: win-deps-x64-${{ hashFiles('windows/Configure-vcpkg.ps1') }}

      - name: Set up Python 3.12
        if: steps.win-deps-x64.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install mako
        if: steps.win-deps-x64.outputs.cache-hit != 'true'
        run: pip install mako

      - name: Add msbuild to PATH
        if: steps.win-deps-x64.outputs.cache-hit != 'true'
        uses: microsoft/setup-msbuild@v2

      - name: Configure vcpkg
        shell: powershell
        run: |
          if (Test-Path "$Env:GITHUB_WORKSPACE\vcpkg\.git") {
            Set-Location "$Env:GITHUB_WORKSPACE\vcpkg"
            git fetch --all
            git checkout master
            git pull --ff-only
            .\bootstrap-vcpkg.bat
          }
          & "$Env:GITHUB_WORKSPACE\windows\Configure-vcpkg.ps1" -platform x64-windows

      - name: Install Aaronia RTSA API
        if: steps.win-deps-x64.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $exe = "$Env:GITHUB_WORKSPACE\vcpkg\rtsa.exe"
          try {
            Invoke-WebRequest -Uri "https://www.satdump.org/Aaronia_RTSA_Suite_PRO_2.2.0.12821_Setup_64bit.exe" -OutFile $exe
          } catch {
            Remove-Item $exe -Force -ErrorAction SilentlyContinue
            Write-Warning "Aaronia RTSA API download failed, skipping Aaronia support: $_"
            "PLUGIN_AARONIA_SDR_SUPPORT=OFF" >> $Env:GITHUB_ENV
            exit 0
          }

          $bytes = [IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 10MB -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            $preview = [Text.Encoding]::ASCII.GetString($bytes[0..([Math]::Min(79, $bytes.Length-1))])
            Remove-Item $exe -Force
            Write-Warning "Aaronia RTSA API download is not an executable (size: $($bytes.Length), starts with: $preview). The site may be serving a bot-challenge page."
            "PLUGIN_AARONIA_SDR_SUPPORT=OFF" >> $Env:GITHUB_ENV
            exit 0
          }

          cmd /c start /wait vcpkg\rtsa.exe /q2 /install
          "PLUGIN_AARONIA_SDR_SUPPORT=ON" >> $Env:GITHUB_ENV

      - name: Add support to NSIS for long PATHs
        shell: powershell
        run: ${{github.workspace}}\windows\Get-NSIS-LongStrings.ps1

      - name: Create Build Environment
        run: cmake -E make_directory ${{runner.workspace}}/build

      - name: Configure CMake
        working-directory: ${{runner.workspace}}/build
        shell: powershell
        run: cmake -DVCPKG_TARGET_TRIPLET="x64-windows" -DPLUGIN_SDRPLAY_SDR_SUPPORT="$env:PLUGIN_SDRPLAY_SDR_SUPPORT" -DPLUGIN_AARONIA_SDR_SUPPORT="$env:PLUGIN_AARONIA_SDR_SUPPORT" -DBUILD_MSVC=ON -DCMAKE_TOOLCHAIN_FILE="${{github.workspace}}\vcpkg\scripts\buildsystems\vcpkg.cmake" "$Env:GITHUB_WORKSPACE"

      - name: Build
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: cmake --build . --config $BUILD_TYPE

      - name: Build Installer
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: cpack -C $BUILD_TYPE

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: SatDump-Windows_x64_Installer
          path: ${{runner.workspace}}/build/SatDump-*.exe

      - name: Add dumpbin to PATH
        run: echo "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\$((Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC" | Sort-Object Name -Descending | Select-Object -First 1).Name)\bin\Hostx64\x64" >> $env:GITHUB_PATH

      - name: Build Portable
        shell: powershell
        run: ${{github.workspace}}\windows\Finish-Release.ps1 -platform x64-windows -BuildPath ${{runner.workspace}}\build

      - name: Upload Portable
        uses: actions/upload-artifact@v4
        with:
          name: SatDump-Windows_x64_Portable
          path: ${{runner.workspace}}/build/Release/*

  build_android:
    runs-on: android-release

    steps:
      - uses: actions/checkout@v4

      - name: Get dependency version
        id: android-deps-ver
        run: commit=$(git -C $GITHUB_WORKSPACE submodule status | grep android) && echo deps_version=${commit:1:6} >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        id: android-deps
        with:
          path: android/deps
          key: android-deps-${{steps.android-deps-ver.outputs.deps_version}}

      - name: Build dependencies
        if: steps.android-deps.outputs.cache-hit != 'true'
        shell: bash
        run: git submodule update --init && cd $GITHUB_WORKSPACE/android/deps && export ANDROID_HOME=/home/owner/android-sdk-linux && sh build.sh && rm .git

      - name: Build
        shell: bash
        run: cd $GITHUB_WORKSPACE/android && export ANDROID_HOME=/home/owner/android-sdk-linux && sh /home/owner/build_release.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SatDump-release.apk
          path: ${{runner.workspace}}/SatDump/android/app/build/outputs/apk/release/app-release.apk

  build_ubuntu_2204:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Update repositories
        run: sudo apt update

      - name: Install dependencies
        run: sudo apt install -y libcurl4-openssl-dev libglfw3-dev libfftw3-dev libvolk2-dev build-essential cmake pkgconf libjpeg-dev libpng-dev libtiff-dev libairspy-dev libairspyhf-dev libhackrf-dev librtlsdr-dev libomp-dev libnng-dev libiio-dev libzstd-dev libad9361-dev libbladerf-dev libuhd-dev liblimesuite-dev ocl-icd-opencl-dev libjemalloc-dev portaudio19-dev libhdf5-dev

      - name: Create Build Environment
        run: cmake -E make_directory ${{runner.workspace}}/build

      - name: Configure CMake
        shell: bash
        working-directory: ${{runner.workspace}}/build
        run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE

      - name: Build
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: make -j8

      - name: Package
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: make package

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SatDump-Ubuntu-22.04
          path: ${{runner.workspace}}/build/*.deb

  build_ubuntu_2404:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Update repositories
        run: sudo apt update

      - name: Install dependencies
        run: sudo apt install -y libcurl4-openssl-dev libglfw3-dev libfftw3-dev libvolk-dev build-essential cmake pkgconf libjpeg-dev libpng-dev libtiff-dev libairspy-dev libairspyhf-dev libhackrf-dev librtlsdr-dev libomp-dev libnng-dev libiio-dev libzstd-dev libad9361-dev libbladerf-dev libuhd-dev liblimesuite-dev ocl-icd-opencl-dev libjemalloc-dev portaudio19-dev libhdf5-dev

      - name: Create Build Environment
        run: cmake -E make_directory ${{runner.workspace}}/build

      - name: Configure CMake
        shell: bash
        working-directory: ${{runner.workspace}}/build
        run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE

      - name: Build
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: make -j8

      - name: Package
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: make package

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SatDump-Ubuntu-24.04
          path: ${{runner.workspace}}/build/*.deb

  build_linux_arm64:
    runs-on: ARM64

    steps:
      - uses: actions/checkout@v4

      - name: Update repositories
        run: sudo apt update

      - name: Install dependencies
        run: sudo apt install -y libcurl4-openssl-dev libglfw3-dev libfftw3-dev libvolk2-dev build-essential cmake pkgconf libjpeg-dev libpng-dev libtiff-dev libairspy-dev libairspyhf-dev libhackrf-dev librtlsdr-dev libomp-dev libnng-dev libiio-dev libzstd-dev libad9361-dev libbladerf-dev libuhd-dev liblimesuite-dev ocl-icd-opencl-dev libjemalloc-dev portaudio19-dev libhdf5-dev

      - name: Delete build dir
        run: rm -rf ${{runner.workspace}}/build

      - name: Create Build Environment
        run: cmake -E make_directory ${{runner.workspace}}/build

      - name: Configure CMake
        shell: bash
        working-directory: ${{runner.workspace}}/build
        run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE

      - name: Build
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: make -j4

      - name: Package
        working-directory: ${{runner.workspace}}/build
        shell: bash
        run: make package

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SatDump-Pi64-Latest
          path: ${{runner.workspace}}/build/*.deb

  update_nightly_release:
    needs: [
        "build_windows_x64",
        "build_ubuntu_2204",
        "build_ubuntu_2404",
        "build_linux_arm64",
        "build_android"
    ]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Install zip
        run: sudo apt install -y unzip

      - name: Copy files
        run: |
          mkdir satdump_out
          cp SatDump-Ubuntu-22.04/satdump*.deb satdump_out/satdump_ubuntu_22.04_amd64.deb
          cp SatDump-Ubuntu-24.04/satdump*.deb satdump_out/satdump_ubuntu_24.04_amd64.deb
          (cd SatDump-Windows_x64_Portable && zip -r ../satdump_out/SatDump-Windows_x64_Portable.zip *)
          cp SatDump-Windows_x64_Installer/SatDump-*.exe satdump_out/SatDump-Windows_x64_Installer.exe
          cp SatDump-Pi64-Latest/satdump*.deb satdump_out/satdump_rpi64_latest_arm64.deb
          cp SatDump-release.apk/app-release.apk satdump_out/SatDump-Android.apk

      - name: Update Nightly
        run: gh release upload nightly satdump_out/* -R ${{github.repository}} --clobber
